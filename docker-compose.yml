services:
  web:
    build: .
    command: sh -c "sleep 5 && python run.py"  # Espera 5 segundos forzadamente
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://user:password@db:5432/tododb
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tododb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
